# Runs each fuzz target (fuzz/README.md) for a few minutes. A crash fails the
# run and its input is uploaded as an artifact.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - "fuzz/**"
      - "src/fuzzing.rs"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_auto
          - decode_jpeg
          - decode_png
          - decode_gif
          - decode_webp
          - decode_bmp
          - decode_jxl
          - decode_avif
          - decode_heif
          - pth
          - release_json
          - rename
          - exif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          secs="${{ github.event.inputs.seconds }}"
          if [ "${{ github.event_name }}" = pull_request ]; then secs=30; fi
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="${secs:-300}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
