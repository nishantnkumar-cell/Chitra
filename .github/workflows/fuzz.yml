# Runs each fuzz target (fuzz/README.md) for a few minutes. A crash fails the
# run and its input is uploaded as an artifact.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - "fuzz/**"
      - "src/fuzzing.rs"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - decode_auto
          - decode_jpeg
          - decode_png
          - decode_gif
          - decode_webp
          - decode_bmp
          - decode_jxl
          - decode_avif
          - decode_heif
          - pth
          - release_json
          - rename
          - exif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          # Passed as a variable, so what is typed in the box is never run as shell.
          SECONDS_WANTED: ${{ github.event.inputs.seconds }}
        run: |
          secs="$SECONDS_WANTED"
          case "$secs" in *[!0-9]*) echo "seconds must be a number"; exit 1;; esac
          if [ "${{ github.event_name }}" = pull_request ]; then secs=30; fi
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="${secs:-300}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
