name: CI

on:
  push:
    branches: [main]
    # GitHub's release form keeps the case typed, so accept V0.2.1 too.
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Size budget for the Windows exe, in bytes (24 MiB). HEIC and AVIF add
  # about 2.3 MB, unwinding for per-file crash isolation about 2.7 MB, and
  # running the AI upscaler on the graphics card (wgpu, DirectX 12) about 2.4 MB.
  MAX_EXE_BYTES: 25165824

# Read-only token by default; only the release job may write.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs so a moved tag cannot change
# what runs here.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Video playback links against GStreamer on Linux.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features gpu -- -D warnings

  # Known vulnerabilities, yanked crates, crates from outside crates.io and
  # banned networking/TLS crates fail the build (see deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check advisories bans sources licenses

  # The release builds wait for Windows and Linux only: macOS runners are
  # sometimes unavailable for a long time, and no release file is built on
  # macOS, so a stuck macOS job must not hold back the installers.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # GStreamer with H.264 and AAC decoders, as desktops ship it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: cargo test
      - run: cargo test --no-default-features --features gpu
      # Plays phone clips through the system player (Media Foundation,
      # AVFoundation or GStreamer) on the main thread, as the viewer does.
      - name: Play phone videos
        shell: bash
        run: |
          cargo run --quiet --bin chitra -- --play-test tests/data/h264-aac.mp4
          cargo run --quiet --bin chitra -- --play-test tests/data/portrait.mov
      # Windows needs the HEVC Video Extensions from the Store for HEVC.
      - name: Play an HEVC video
        if: runner.os != 'Windows'
        run: cargo run --quiet --bin chitra -- --play-test tests/data/hevc.mov

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # GStreamer with H.264 and AAC decoders, as desktops ship it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: cargo test
      - run: cargo test --no-default-features --features gpu
      # Plays phone clips through the system player (Media Foundation,
      # AVFoundation or GStreamer) on the main thread, as the viewer does.
      - name: Play phone videos
        shell: bash
        run: |
          cargo run --quiet --bin chitra -- --play-test tests/data/h264-aac.mp4
          cargo run --quiet --bin chitra -- --play-test tests/data/portrait.mov
      # Windows needs the HEVC Video Extensions from the Store for HEVC.
      - name: Play an HEVC video
        if: runner.os != 'Windows'
        run: cargo run --quiet --bin chitra -- --play-test tests/data/hevc.mov

  windows-release:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Tagged release builds start clean rather than from a cache.
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
      - name: Build exe
        run: |
          cargo build --release
          Copy-Item target/release/chitra.exe chitra.exe
          Copy-Item target/release/chitra-cli.exe chitra-cli.exe
      - name: Check size and smoke-test the CLI
        shell: pwsh
        run: |
          $size = (Get-Item chitra.exe).Length
          $cli = (Get-Item chitra-cli.exe).Length
          # As annotations, so the sizes show on the pull request page.
          Write-Host "::notice title=Exe size::chitra.exe $([math]::Round($size / 1MB, 2)) MiB, chitra-cli.exe $([math]::Round($cli / 1MB, 2)) MiB"
          if ($size -gt [int]$env:MAX_EXE_BYTES) { throw "chitra.exe exceeds the size budget" }
          ./chitra-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "chitra-cli --version failed" }
      - name: Check exploit mitigations (ASLR, DEP, Control Flow Guard)
        shell: pwsh
        run: |
          foreach ($exe in 'chitra.exe', 'chitra-cli.exe') {
            $b = [IO.File]::ReadAllBytes((Resolve-Path $exe))
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            # DllCharacteristics sits 70 bytes into the PE32+ optional header.
            $dc = [BitConverter]::ToUInt16($b, $pe + 24 + 70)
            $need = @{ DYNAMIC_BASE = 0x40; HIGH_ENTROPY_VA = 0x20; NX_COMPAT = 0x100; GUARD_CF = 0x4000 }
            foreach ($k in $need.Keys) {
              if (($dc -band $need[$k]) -eq 0) { throw "$exe is missing $k" }
            }
            Write-Host ("{0}: DllCharacteristics 0x{1:X4} ok" -f $exe, $dc)
          }
      # The built exe, end to end, on Windows: every format decoded and encoded
      # through the real binary (the unit tests run the library, not this).
      - name: Run the built exe on every format
        shell: pwsh
        run: |
          $d = "smoke"
          New-Item -ItemType Directory $d | Out-Null
          $fail = @()
          function Step($what, [scriptblock]$run) {
            & $run
            if ($LASTEXITCODE -ne 0) { $script:fail += "$what (exit $LASTEXITCODE)" }
          }
          # Decode a sample of each hard format to PNG (still and animated).
          foreach ($f in 'pattern.avif', 'pattern.heic', 'alpha.heic', 'exif.jxl', 'animated5.jxl') {
            Step "decode $f" { ./chitra-cli.exe convert "tests/data/$f" --to png --out $d }
          }
          # Encode one picture into every writable format, then read each back.
          $png = "$d/pattern.png"
          foreach ($to in 'jpg', 'png', 'gif', 'bmp', 'webp', 'avif', 'jxl') {
            Step "encode $to" { ./chitra-cli.exe convert $png --to $to --out "$d/$to" }
            $out = Get-ChildItem "$d/$to" -Filter "pattern.*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $out -or $out.Length -eq 0) { $fail += "no $to output"; continue }
            Step "read $to back" { ./chitra-cli.exe info $out.FullName }
          }
          # Location removal, resizing and the AI model list through the exe.
          Step "strip location" { ./chitra-cli.exe convert tests/data/exif.jxl --to jpg --strip-location --out "$d/strip" }
          Step "resize" { ./chitra-cli.exe convert $png --to jpg --resize 50% --out "$d/resize" }
          # 'list' exits 1 when no model is installed (by design, for scripts), so
          # accept 0 or 1 and check the table is printed.
          $models = ./chitra-cli.exe ai-model list
          if ($LASTEXITCODE -gt 1 -or -not ($models -match 'best-2x')) { $fail += "ai-model list (exit $LASTEXITCODE)" }
          # Updates and model downloads use the system's curl.exe.
          Step "system curl" { & "$env:SystemRoot\System32\curl.exe" --version }
          if ($fail.Count -gt 0) { throw ("failed: " + ($fail -join "; ")) }
          Write-Host "all steps passed"
      # Best effort, never blocking: start the window on a photo, make sure it
      # stays up, and keep a screenshot so the interface can be looked at. The
      # runner has no graphics card, so a missing OpenGL is possible.
      - name: Start the app and take a screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          $photo = (Resolve-Path "smoke/pattern.png").Path
          $p = Start-Process -FilePath (Resolve-Path ./chitra.exe).Path -ArgumentList "`"$photo`"" -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("chitra-window.png")
          if ($p.HasExited) { throw "chitra.exe exited by itself with code $($p.ExitCode)" }
          Write-Host "the window stayed up for 12 s"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: chitra-windows-screenshot
          path: chitra-window.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chitra-windows-x64
          path: |
            chitra.exe
            chitra-cli.exe
            README.md
            LICENSE
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }
          & $iscc /Qp "/DAppVersion=$version" installer\chitra.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist | ForEach-Object { Write-Host "$($_.Name) is $([math]::Round($_.Length / 1MB, 2)) MB" }
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Chitra-Setup-*.exe).FullName
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Chitra"
          & "$app\chitra-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed chitra-cli does not run" }
          foreach ($f in 'chitra.exe', 'LICENSE-AGPL-3.0.txt', 'NOTICE.txt') {
            if (-not (Test-Path "$app\$f")) { throw "$f was not installed" }
          }
          $openWith = Get-ItemProperty 'HKCU:\Software\Classes\.jxl\OpenWithProgids'
          if ($null -eq $openWith.'Chitra.Image') { throw "Open with entry for .jxl missing" }
          $openWith = Get-ItemProperty 'HKCU:\Software\Classes\.heic\OpenWithProgids'
          if ($null -eq $openWith.'Chitra.Image') { throw "Open with entry for .heic missing" }
          $openWith = Get-ItemProperty 'HKCU:\Software\Classes\.mov\OpenWithProgids'
          if ($null -eq $openWith.'Chitra.Video') { throw "Open with entry for .mov missing" }
          if (-not (Test-Path 'HKCU:\Software\Classes\Directory\shell\Chitra\command')) { throw "folder menu entry missing" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Chitra.lnk"
          if (-not (Test-Path $menu)) { throw "Start menu shortcut missing" }
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller finishes from a temporary copy, so wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\chitra.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\chitra.exe") { throw "uninstall left chitra.exe behind" }
          if (Test-Path 'HKCU:\Software\Classes\Chitra.Image') { throw "uninstall left the ProgId behind" }
          if (Test-Path 'HKCU:\Software\Classes\Chitra.Video') { throw "uninstall left the video ProgId behind" }
          Write-Host "Installer installs, registers and uninstalls cleanly"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chitra-windows-installer
          path: dist/Chitra-Setup-*.exe

  # Linux tarball and Flatpak for current KDE Plasma and GNOME.
  linux-release:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev desktop-file-utils appstream flatpak flatpak-builder dbus-user-session libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Check the menu entry and software-centre metadata
        run: |
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml
      - name: Build and pack the tarball
        run: |
          cargo build --release
          ls -l target/release/chitra target/release/chitra-cli
          sh tools/package_linux.sh
      - name: Install, run and uninstall the tarball
        run: |
          mkdir t
          tar -C t -xzf dist/chitra-*-linux-x86_64.tar.gz
          PREFIX="$PWD/t/prefix" t/chitra-*/install.sh
          t/prefix/bin/chitra-cli --version
          t/prefix/bin/chitra --play-test "$PWD/tests/data/h264-aac.mp4"
          t/prefix/bin/chitra-cli convert tests/data/pattern.heic --to avif --out t/out
          test -s t/out/pattern.avif
          PREFIX="$PWD/t/prefix" t/chitra-*/install.sh --uninstall
          test ! -e t/prefix/bin/chitra
      - name: Build, install and remove the Debian package
        run: |
          sh tools/package_deb.sh
          dpkg-deb -I dist/chitra_*_amd64.deb
          sudo apt-get install -y ./dist/chitra_*_amd64.deb
          /usr/bin/chitra-cli --version
          /usr/bin/chitra --play-test "$PWD/tests/data/h264-aac.mp4"
          sudo apt-get remove -y chitra
          test ! -e /usr/bin/chitra
      - name: Build the Flatpak
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.nishantnkumar_cell.Chitra.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/Chitra-$VERSION-x86_64.flatpak" io.github.nishantnkumar_cell.Chitra
      - name: Install and run the Flatpak
        run: |
          flatpak install --user -y --noninteractive dist/*.flatpak
          dbus-run-session -- flatpak run --command=chitra-cli io.github.nishantnkumar_cell.Chitra --version
          dbus-run-session -- flatpak run --command=chitra-cli io.github.nishantnkumar_cell.Chitra \
            convert "$PWD/tests/data/pattern.heic" --to png --out "$PWD/t/flatpak"
          test -s t/flatpak/pattern.png
          dbus-run-session -- flatpak run --command=chitra io.github.nishantnkumar_cell.Chitra \
            --play-test "$PWD/tests/data/h264-aac.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chitra-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.flatpak

  # A release tag must match the version in Cargo.toml, so the app reports
  # the version it was released as (a tag made before the version bump
  # merged would not).
  tag-version:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          got="${TAG#[vV]}"
          if [ "$got" != "$want" ]; then
            echo "::error::Tag $TAG does not match version $want in Cargo.toml. Delete the release and tag, and tag the commit that has the version bump."
            exit 1
          fi

  # Pushing a tag such as v0.1.0 drafts a GitHub release with the Windows
  # installer and the Linux packages attached. It stays a draft until someone
  # publishes it.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: [tag-version, windows-release, linux-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            artifacts/chitra-windows-installer/*.exe
            artifacts/chitra-windows-x64/chitra.exe
            artifacts/chitra-windows-x64/chitra-cli.exe
            artifacts/chitra-linux-x86_64/*
