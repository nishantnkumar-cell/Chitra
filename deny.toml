# cargo-deny: run by CI on every push and pull request.
#   cargo install cargo-deny --locked && cargo deny check

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# Any vulnerability, yanked crate or unsound advisory fails the build.
yanked = "deny"
# Unmaintained warnings only for direct dependencies. The one indirect hit today
# is paste (RUSTSEC-2024-0436), a compile-time macro used by rav1e and zenwebp:
# no code from it ends up in the program.
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# No TLS or networking stacks in Chitra: the update check and model
# downloads use the system's curl program.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
]

[sources]
# Only crates.io; the one patched crate lives in vendor/.
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Chitra is AGPL-3.0-or-later; everything it links must be compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
