[package]
name = "chitra-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chitra = { path = "..", default-features = false, features = ["lossy-encoders"] }

# Not part of the main package or its Cargo.lock.
[workspace]

# The same patched AVIF decoder the app is built with.
[patch.crates-io]
oxideav-avif = { path = "../vendor/oxideav-avif" }

[[bin]]
name = "decode_auto"
path = "fuzz_targets/decode_auto.rs"
test = false
doc = false
bench = false

